<!-- ═══════════ TUTORIEL JEU VIDÉO ═══════════ -->
<div class="tour-overlay" id="tour-overlay" style="display:none;"></div>
<div class="tour-spotlight" id="tour-spotlight"></div>
<div class="tour-arrow" id="tour-arrow">👆</div>
<div class="tour-overlay" id="tour-card-overlay" style="display:none;align-items:flex-end;padding-bottom:2rem;">
<div class="tour-card" id="tour-card" onclick="event.stopPropagation()">
<div class="tour-card-header">
<span class="tour-step-badge" id="tour-step-badge">Étape 1/4</span>
<button type="button" class="tour-skip-btn" id="tour-skip-btn">Passer</button>
</div>
<div class="tour-icon" id="tour-icon">💡</div>

<button type="button" class="tour-btn-next" id="tour-btn-next">Suivant →</button>
</div>
<div class="tour-progress" id="tour-progress"></div>
</div>
</div>

<!doctype html>

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.json" />
    <title>Studio Master — Créez vos vidéos IA</title>
    <meta name="description" content="Studio Master — Créez vos vidéos IA en 3 étapes · TikTok · Films · Séries · Compatible iOS · Android · Desktop" />
    <meta property="og:title" content="Studio Master — Créez vos vidéos IA" />
    <meta property="og:description" content="Créez vos vidéos IA en 3 étapes · TikTok · Films · Séries" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Plus+Jakarta+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        background: #0a0a12;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        transition: opacity 0.4s ease;
      }
      .splash-screen.fade-out {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 100px;
        height: 100px;
        animation: splashPulse 2s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(0.98); opacity: 0.85; }
        50% { transform: scale(1.02); opacity: 1; }
      }
      .splash-title {
        margin-top: 24px;
        font-size: 14px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #8a8896;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      .splash-bar {
        margin-top: 20px;
        width: 200px;
        height: 3px;
        background: rgba(229, 193, 90, 0.15);
        border-radius: 2px;
        overflow: hidden;
        position: relative;
      }
      .splash-bar::after {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, #e5c15a, transparent);
        animation: splashShine 1.5s ease-in-out infinite;
      }
      @keyframes splashShine {
        0% { left: -100%; }
        100% { left: 100%; }
      }
      .splash-loading {
        margin-top: 12px;
        font-size: 11px;
        color: #4a4858;
        font-style: italic;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      @media (prefers-reduced-motion: reduce) {
        .splash-logo, .splash-bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="splash-screen" id="splash-screen">
      <svg class="splash-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="38" stroke="#e5c15a" stroke-width="1.5" fill="none" opacity="0.4"/>
        <g fill="#e5c15a">
          <path d="M50 12 L58 28 L42 28 Z"/>
          <path d="M85 38 L72 48 L78 60 Z"/>
          <path d="M85 62 L72 52 L78 40 Z"/>
          <path d="M50 88 L42 72 L58 72 Z"/>
          <path d="M15 62 L28 52 L22 40 Z"/>
          <path d="M15 38 L28 48 L22 60 Z"/>
        </g>
        <circle cx="50" cy="50" r="8" fill="#0a0a12"/>
        <circle cx="50" cy="50" r="9" stroke="#e5c15a" stroke-width="1" fill="none" opacity="0.8"/>
      </svg>
      <div class="splash-title">Studio Master</div>
      <div class="splash-bar"></div>
      <div class="splash-loading">Chargement…</div>
    </div>
    <script>
      (function() {
        const splashStart = Date.now();
        const MIN_DISPLAY = 800;
        const MAX_DISPLAY = 3000;
        
        function hideSplash() {
          const splash = document.getElementById('splash-screen');
          if (!splash) return;
          const elapsed = Date.now() - splashStart;
          const waitMore = Math.max(0, MIN_DISPLAY - elapsed);
          setTimeout(() => {
            splash.classList.add('fade-out');
            setTimeout(() => {
              splash.style.display = 'none';
            }, 450);
          }, waitMore);
        }
        
        window.addEventListener('load', hideSplash);
        setTimeout(() => {
          const splash = document.getElementById('splash-screen');
          if (splash && !splash.classList.contains('fade-out')) hideSplash();
        }, MAX_DISPLAY);
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
